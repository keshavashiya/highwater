name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope: this job only reads the repo.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # Same three commands as `just ci`, so local green means remote green.
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
