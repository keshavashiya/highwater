[project]
name = "highwater"
version = "0.1.0"
description = "A surface-code decoder, instrumented as a real-time systems artefact."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keshav Ashiya" }]
requires-python = ">=3.12"
dependencies = [
    "stim>=1.16",
    "pymatching>=2.4",
    "sinter>=1.16",
    "numpy",
]

[project.urls]
Repository = "https://github.com/keshavashiya/highwater"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Single-word test file names; pytest only collects test_*.py by default.
python_files = ["*.py"]
